<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #23211D; background: #F6F3ED; -webkit-font-smoothing: antialiased; }
    a { color: #A65A3C; } a:hover { color: #7E4029; }
    h1, h2, h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 400; margin: 0; letter-spacing: -0.015em; }
    .app { display: grid; grid-template-columns: 236px 1fr; min-height: 880px; }
    .side { background: #F0EAE0; border-right: 1px solid #E2DCD0; padding: 26px 18px; display: flex; flex-direction: column; gap: 26px; }
    .brand { display: flex; gap: 10px; align-items: center; padding-left: 3px; }
    .wordmark { font-family: 'Newsreader', Georgia, serif; font-size: 19px; font-weight: 500; letter-spacing: -0.03em; text-transform: uppercase; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 8px; font-size: 13.5px; color: #55503F; text-decoration: none; }
    .nav-item svg { flex: 0 0 auto; opacity: .7; }
    .nav-item.on { background: #FDFBF7; color: #23211D; font-weight: 500; box-shadow: 0 1px 2px rgba(60,45,30,.05); }
    .nav-item.on svg { opacity: 1; color: #A65A3C; }
    .side-foot { margin-top: auto; font-size: 11.5px; color: #8F887C; border-top: 1px solid #E2DCD0; padding-top: 14px; line-height: 1.6; }
    .main { padding: 34px 40px 44px; display: flex; flex-direction: column; gap: 26px; overflow: hidden; }
    .eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: #8F887C; margin-bottom: 7px; }
    .card { background: #FDFBF7; border: 1px solid #E2DCD0; border-radius: 12px; padding: 22px 24px; }
    .card-title { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #8F887C; margin-bottom: 16px; }
    .btn { font: inherit; font-size: 13px; border: 1px solid #E2DCD0; background: #FDFBF7; color: #23211D; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
    .btn-primary { background: #A65A3C; border-color: #A65A3C; color: #FFF8F4; font-weight: 500; }
    .pill { font-size: 11.5px; padding: 4px 10px; border-radius: 100px; }
    .muted { color: #6B6459; }
  </style>
</helmet>

<div style="width:390px; min-height:1000px; background:#F6F3ED; position:relative; display:flex; flex-direction:column;">
  <div style="padding:22px 20px 0; flex:1; display:flex; flex-direction:column;">

      <div style="font-size:14px; font-weight:500;">Amelia Rivera</div>
    </div>
    <h1 style="font-size:27px; line-height:1.15;">Before we find<br>a time</h1>
    <p style="font-size:14px; color:#6B6459; margin:10px 0 26px; line-height:1.55;">Three questions, all on this page. About a minute.</p>
    <div style="display:flex; flex-direction:column; gap:26px; padding-bottom:104px;">
      <div><div style="font-size:14.5px; font-weight:500; margin-bottom:10px;">What are you hoping to achieve?</div>
        <div style="border:1px solid #E2DCD0; background:#FDFBF7; border-radius:11px; padding:14px 15px; font-size:14.5px; color:#ABA396; min-height:92px;">Type your answer…</div></div>
      <div><div style="font-size:14.5px; font-weight:500; margin-bottom:10px;">Have you worked with a coach before?</div>
        <div style="display:flex; flex-direction:column; gap:9px;"><div style="border:1px solid #E2DCD0; background:#FDFBF7; border-radius:11px; padding:0 15px; font-size:14.5px; min-height:54px; display:flex; align-items:center; gap:11px; color:#3A352C;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #C2B9A9; flex:0 0 auto;"></span>Yes</div><div style="border:1.5px solid #A65A3C; background:#F4E6DE; border-radius:11px; padding:0 15px; font-size:14.5px; min-height:54px; display:flex; align-items:center; gap:11px;"><span style="width:18px; height:18px; border-radius:50%; border:5px solid #A65A3C; background:#FDFBF7; flex:0 0 auto;"></span>No</div></div></div>
      <div><div style="font-size:14.5px; font-weight:500; margin-bottom:10px;">What are you able to invest right now?</div>
        <div style="display:flex; flex-direction:column; gap:9px;"><div style="border:1px solid #E2DCD0; background:#FDFBF7; border-radius:11px; padding:0 15px; font-size:14.5px; min-height:54px; display:flex; align-items:center; gap:11px; color:#3A352C;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #C2B9A9; flex:0 0 auto;"></span>Over 2.000 €</div><div style="border:1px solid #E2DCD0; background:#FDFBF7; border-radius:11px; padding:0 15px; font-size:14.5px; min-height:54px; display:flex; align-items:center; gap:11px; color:#3A352C;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #C2B9A9; flex:0 0 auto;"></span>500 – 2.000 €</div><div style="border:1px solid #E2DCD0; background:#FDFBF7; border-radius:11px; padding:0 15px; font-size:14.5px; min-height:54px; display:flex; align-items:center; gap:11px; color:#3A352C;"><span style="width:18px; height:18px; border-radius:50%; border:1.5px solid #C2B9A9; flex:0 0 auto;"></span>Not right now</div></div></div>
    </div>
    <div style="position:absolute; left:0; right:0; bottom:0; padding:14px 20px 24px; background:linear-gradient(to top, #F6F3ED 62%, rgba(246,243,237,0));">
      <div style="background:#A65A3C; color:#FFF8F4; font-size:15.5px; font-weight:500; min-height:54px; border-radius:12px; display:flex; align-items:center; justify-content:center;">Continue</div>
      <div style="text-align:center; font-size:11.5px; color:#8F887C; margin-top:10px;">2 of 3 answered</div>
    </div>
  </div>
</div>
</x-dc>
