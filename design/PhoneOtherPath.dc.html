<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #23211D; background: #F6F3ED; -webkit-font-smoothing: antialiased; }
    a { color: #A65A3C; } a:hover { color: #7E4029; }
    h1, h2, h3 { font-family: 'Newsreader', Georgia, serif; font-weight: 400; margin: 0; letter-spacing: -0.015em; }
    .app { display: grid; grid-template-columns: 236px 1fr; min-height: 880px; }
    .side { background: #F0EAE0; border-right: 1px solid #E2DCD0; padding: 26px 18px; display: flex; flex-direction: column; gap: 26px; }
    .brand { display: flex; gap: 10px; align-items: center; padding-left: 3px; }
    .wordmark { font-family: 'Newsreader', Georgia, serif; font-size: 22px; letter-spacing: -0.01em; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 8px; font-size: 13.5px; color: #55503F; text-decoration: none; }
    .nav-item svg { flex: 0 0 auto; opacity: .7; }
    .nav-item.on { background: #FDFBF7; color: #23211D; font-weight: 500; box-shadow: 0 1px 2px rgba(60,45,30,.05); }
    .nav-item.on svg { opacity: 1; color: #A65A3C; }
    .side-foot { margin-top: auto; font-size: 11.5px; color: #8F887C; border-top: 1px solid #E2DCD0; padding-top: 14px; line-height: 1.6; }
    .main { padding: 34px 40px 44px; display: flex; flex-direction: column; gap: 26px; overflow: hidden; }
    .eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: #8F887C; margin-bottom: 7px; }
    .card { background: #FDFBF7; border: 1px solid #E2DCD0; border-radius: 12px; padding: 22px 24px; }
    .card-title { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #8F887C; margin-bottom: 16px; }
    .btn { font: inherit; font-size: 13px; border: 1px solid #E2DCD0; background: #FDFBF7; color: #23211D; padding: 8px 15px; border-radius: 8px; cursor: pointer; }
    .btn-primary { background: #A65A3C; border-color: #A65A3C; color: #FFF8F4; font-weight: 500; }
    .pill { font-size: 11.5px; padding: 4px 10px; border-radius: 100px; }
    .muted { color: #6B6459; }
  </style>
</helmet>

<div style="width:390px; min-height:844px; background:#F6F3ED; position:relative; display:flex; flex-direction:column;">
  <div style="padding:22px 20px 0; flex:1; display:flex; flex-direction:column;">
    <div style="display:flex; align-items:center; gap:11px; margin-bottom:20px;">
      <div style="width:34px; height:34px; border-radius:9px; background:#F0EAE0; border:1px solid #E2DCD0; display:flex; align-items:center; justify-content:center; font-family:'Newsreader', Georgia, serif; font-size:15px; color:#7E4029;">AR</div>
      <div style="font-size:14px; font-weight:500;">Amelia Rivera</div>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; justify-content:center; padding-bottom:40px;">
      <div style="margin-bottom:24px;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#A65A3C" stroke-width="1.4" stroke-linecap="round"><path d="M4.5 21V11a7.5 7.5 0 0 1 15 0v10"/></svg></div>
      <h1 style="font-size:28px; line-height:1.2;">Not the right time?<br>That’s completely okay.</h1>
      <p style="font-size:15px; color:#4A4438; margin:18px 0 0; line-height:1.7;">You’re always welcome back when the timing feels right.</p>
      <p style="font-size:15px; color:#4A4438; margin:14px 0 0; line-height:1.7;">The guide below covers the same ground and costs nothing.</p>
    </div>
    <div style="padding-bottom:8px; display:flex; flex-direction:column; gap:9px;">
      <div style="background:#23211D; color:#FBF8F2; font-size:15.5px; font-weight:500; min-height:54px; border-radius:12px; display:flex; align-items:center; justify-content:center;">Get the free guide</div>
      <div style="border:1px solid #E2DCD0; background:#FDFBF7; font-size:14.5px; min-height:54px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#4A4438;">Save my answers for later</div>
    </div>
    <div style="text-align:center; padding:22px 0 20px; display:flex; align-items:center; justify-content:center; gap:5px; opacity:.45;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#6B6459" stroke-width="2" stroke-linecap="round"><path d="M4.5 21V11a7.5 7.5 0 0 1 15 0v10"/></svg><span style="font-size:10.5px; color:#6B6459;">Powered by Cerca</span></div>
  </div>
</div>
</x-dc>

}
</script>
</body>
</html>
